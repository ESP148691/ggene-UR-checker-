<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gジェネエターナル ファンツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
  :root{
    --void:#05070d;
    --void-2:#0a0f1a;
    --panel:rgba(16,22,32,.68);
    --panel-2:#0e141d;
    --panel-solid:#121924;
    --line:rgba(107,224,224,.16);
    --line-strong:rgba(140,160,180,.28);
    --gold:#dab949;
    --gold-dim:#8a7128;
    --cyan:#6be0e0;
    --cyan-dim:#3f8f8f;
    --violet:#7a5fcf;
    --indigo:#2c3f7a;
    --emerald-rgb:52,224,177;
    --text:#eef3f6;
    --muted:#93a3b3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--text);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100%;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(107,224,224,.3);color:#fff;}

  /* ---------- 背景レイヤー ---------- */
  #starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;}

  .nebula{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;mix-blend-mode:screen;will-change:transform;}
  .nebula-a{width:62vmax;height:62vmax;top:-24vmax;left:-18vmax;background:radial-gradient(circle at 32% 32%, var(--violet), transparent 68%);opacity:.5;animation:driftA 80s ease-in-out infinite alternate;}
  .nebula-b{width:54vmax;height:54vmax;bottom:-22vmax;right:-16vmax;background:radial-gradient(circle at 62% 62%, var(--indigo), transparent 68%);opacity:.55;animation:driftB 100s ease-in-out infinite alternate;}
  @keyframes driftA{from{transform:translate(0,0) scale(1);}to{transform:translate(5vmax,4vmax) scale(1.1);}}
  @keyframes driftB{from{transform:translate(0,0) scale(1);}to{transform:translate(-4vmax,-5vmax) scale(1.06);}}

  .galaxyGlow{position:fixed;top:-6vmax;right:-6vmax;width:62vmax;height:62vmax;max-width:780px;max-height:780px;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 55% 45%, rgba(52,224,177,.3), rgba(107,224,224,.15) 38%, transparent 72%);
    filter:blur(34px);opacity:.9;}
  #galaxySprite{position:fixed;top:-6vmax;right:-6vmax;width:62vmax;height:62vmax;max-width:780px;max-height:780px;z-index:0;pointer-events:none;opacity:.95;animation:spin 210s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1px, transparent 3px);
    animation:scan 9s linear infinite;background-size:100% 3px;}
  @keyframes scan{from{background-position-y:0;}to{background-position-y:120px;}}

  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, transparent 45%, rgba(2,4,9,.65) 100%);}

  @media (prefers-reduced-motion: reduce){
    .nebula, #galaxySprite, .galaxyGlow, .scanlines, .navcard .icon::before, .navcard .icon::after, .routeTag .dot, .soonTitle, .navcard .name{animation:none !important;}
  }

  /* ---------- コンテンツ ---------- */
  main.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(48px + env(safe-area-inset-bottom,0px));}

  .eyebrow{
    font-family:'Share Tech Mono',monospace;font-weight:400;
    letter-spacing:.16em;font-size:11px;color:var(--cyan);text-transform:uppercase;
    display:flex;align-items:center;gap:8px;margin:0 0 18px;opacity:.85;
  }
  .eyebrow::before{content:"";width:6px;height:6px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);display:inline-block;border-radius:1px;}
  .eyebrow .jp{font-family:'Noto Sans JP',sans-serif;letter-spacing:.05em;color:var(--muted);font-size:12px;margin-left:2px;}

  .titlerow{display:flex;align-items:center;gap:18px;margin-bottom:14px;}
  .logo-wrap{position:relative;width:52px;height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .logo-wrap .ring{position:absolute;border-radius:50%;pointer-events:none;}
  .logo-wrap .ring-1{inset:-11px;border:1px dashed var(--cyan);opacity:.5;animation:spin 46s linear infinite;}
  .logo-wrap .ring-2{inset:-20px;border:1px solid var(--gold-dim);opacity:.3;animation:spin 78s linear infinite reverse;}
  .logo-wrap .blip{position:absolute;top:-2.5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 7px var(--cyan);}
  .logo-wrap img{width:40px;height:40px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 0 8px rgba(107,224,224,.35));}
  @media (prefers-reduced-motion: reduce){.logo-wrap .ring{animation:none;}}

  h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.01em;}
  .sub{color:var(--muted);font-size:12.5px;margin:14px 0 34px;line-height:1.8;max-width:46ch;}

  .sectionLabel{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12.5px;color:var(--muted);
    letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:8px;
  }
  .sectionLabel::after{content:"";flex:1;height:1px;background:linear-gradient(90deg, var(--line-strong), transparent);}

  .section{margin-bottom:34px;position:relative;padding-left:2px;}
  .route{position:relative;}
  .route::before{
    content:"";position:absolute;left:37px;top:52px;bottom:52px;width:2px;z-index:0;
    background:repeating-linear-gradient(180deg, var(--cyan) 0 5px, transparent 5px 13px);
    background-size:2px 26px;opacity:.4;animation:flow 1.1s linear infinite;
  }
  @keyframes flow{to{background-position-y:-26px;}}
  @media (prefers-reduced-motion: reduce){.route::before{animation:none;}}

  .navcard{
    position:relative;display:flex;align-items:center;gap:18px;isolation:isolate;overflow:hidden;
    background:var(--panel);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid var(--line);border-radius:4px;
    padding:20px;margin-bottom:14px;text-decoration:none;color:var(--text);
    transition:border-color .25s ease, box-shadow .25s ease, transform .25s ease;
  }
  .navcard::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(115deg, transparent 35%, rgba(107,224,224,.10), transparent 65%);
    transform:translateX(-140%);transition:transform .7s ease;
  }
  .navcard:hover{border-color:var(--gold);box-shadow:0 0 26px rgba(218,185,73,.16), inset 0 0 22px rgba(107,224,224,.05);transform:translateY(-2px);}
  .navcard:hover::before{transform:translateX(140%);}
  .navcard:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){.navcard{transition:border-color .2s ease;}.navcard:hover{transform:none;}}

  .navcard .icon{
    position:relative;overflow:visible;isolation:isolate;
    flex:0 0 auto;width:68px;height:68px;display:flex;align-items:center;justify-content:center;
    border-radius:5px;
  }
  /* 外側:ゆっくり明滅して広がる、オーロラの後光 */
  .navcard .icon::after{
    content:"";position:absolute;inset:-30px;z-index:-1;border-radius:50%;
    background:radial-gradient(circle, rgba(107,224,224,.4), rgba(var(--emerald-rgb),.22) 42%, transparent 72%);
    filter:blur(15px);opacity:.6;animation:auroraPulse 6s ease-in-out infinite;
  }
  /* 内側:フレームのふちを縁取るように回転するエメラルドの光の帯 */
  .navcard .icon::before{
    content:"";position:absolute;inset:-11px;z-index:0;border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(var(--emerald-rgb),.9), rgba(var(--emerald-rgb),0) 22%,
      rgba(107,224,224,.75) 48%, rgba(var(--emerald-rgb),0) 70%,
      rgba(var(--emerald-rgb),.9));
    filter:blur(4px);opacity:.85;animation:auroraSpin 13s linear infinite;
  }
  @keyframes auroraSpin{to{transform:rotate(360deg);}}
  @keyframes auroraPulse{0%,100%{transform:scale(.88);opacity:.45;}50%{transform:scale(1.18);opacity:.8;}}
  .navcard .icon .icoImg{
    position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
    border-radius:4px;border:1px solid var(--line-strong);background:var(--panel-solid);
    opacity:0;transition:opacity .5s ease;
  }
  .navcard .icon .icoImg.show{opacity:1;}
  /* サポート画像はキャラクターが右側に描かれているため、右寄りをトリミングして表示 */
  .navcard .icon .icoImg.poolSupporter{object-position:78% center;}
  .navcard .body{flex:1;min-width:0;}
  .navcard .name{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em;
    background:linear-gradient(100deg, var(--cyan), var(--gold) 50%, var(--cyan));
    background-size:240% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 8s linear infinite;
  }
  .navcard .desc{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5;}
  .navcard .arrow{flex:0 0 auto;color:var(--cyan);font-size:19px;}

  .navcard.soon{
    cursor:default;flex-direction:row;align-items:center;justify-content:space-between;text-align:left;
    padding:12px 16px;gap:10px;border-style:dashed;border-color:var(--line-strong);margin-bottom:10px;
  }
  .navcard.soon:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(107,224,224,.12);transform:none;}
  .navcard.soon:hover::before{transform:translateX(-140%);}

  .routeTag{
    display:flex;align-items:center;gap:6px;flex:0 0 auto;
    font-family:'Share Tech Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted);
  }
  .routeTag .dot{width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:pulseDot 2.6s ease-in-out infinite;}
  .soonTitle{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:.08em;white-space:nowrap;
    background:linear-gradient(100deg, var(--cyan), var(--gold) 50%, var(--cyan));
    background-size:240% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 7s linear infinite;
  }
  @keyframes pulseDot{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes shimmer{to{background-position:-240% center;}}

  /* スマホ幅はそのまま。760px以上の広い画面のみ横幅を活かすレイアウトに切り替える */
  @media (min-width: 760px){
    main.wrap{max-width:920px;}
    .route{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    .route .navcard{margin-bottom:0;}
    .route::before{display:none;} /* 縦一列の航路線は2カラムでは意味をなさないため非表示 */
    .soonGroup{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .soonGroup .navcard{margin-bottom:0;}
  }
</style>
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>
<div class="nebula nebula-a" aria-hidden="true"></div>
<div class="nebula nebula-b" aria-hidden="true"></div>
<div class="galaxyGlow" aria-hidden="true"></div>
<canvas id="galaxySprite" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="wrap">
  <p class="eyebrow">GJENERATION ETERNAL <span class="jp">ジージェネレーション エターナル</span></p>

  <div class="titlerow">
    <div class="logo-wrap">
      <div class="ring ring-1"><span class="blip"></span></div>
      <div class="ring ring-2"></div>
      <img src="images/logo.png" alt="ESP logo">
    </div>
    <h1>ファンツール トップ</h1>
  </div>
  <p class="sub">Gジェネエターナルのファン向け非公式ツールです。ログインしなくても、各チェッカーはこれまで通りそのままお使いいただけます。</p>

  <div class="section route">
    <p class="sectionLabel">チェッカー</p>
    <a class="navcard" href="/unit">
      <div class="icon" data-pool="unit"><img class="icoImg" alt="" aria-hidden="true"></div>
      <div class="body">
        <div class="name">UR機体所持率チェッカー</div>
        <div class="desc">全84機のUR機体所持状況を記録・可視化</div>
      </div>
      <div class="arrow">&rsaquo;</div>
    </a>
    <a class="navcard" href="/supporter.html">
      <div class="icon" data-pool="supporter"><img class="icoImg" alt="" aria-hidden="true"></div>
      <div class="body">
        <div class="name">URサポート所持率チェッカー</div>
        <div class="desc">全49体のURサポート所持状況を記録・可視化</div>
      </div>
      <div class="arrow">&rsaquo;</div>
    </a>
  </div>

  <div class="section soonGroup">
    <p class="sectionLabel">今後追加予定</p>
    <!-- 確定時: ROUTE 03 → 「エタロ攻略チェッカー」のnavcard（route内と同じ構造）に差し替え -->
    <div class="navcard soon">
      <div class="routeTag"><span class="dot"></span>ROUTE 03</div>
      <div class="soonTitle">COMING SOON</div>
    </div>
    <!-- 確定時: ROUTE 04 → 「称号獲得チェッカー」のnavcard（route内と同じ構造）に差し替え -->
    <div class="navcard soon">
      <div class="routeTag"><span class="dot"></span>ROUTE 04</div>
      <div class="soonTitle">COMING SOON</div>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var UNIT_IMAGES = Array.from({length:84}, function(_, i){ return 'images/units/' + (i+1) + '.jpg'; });
  var SUPPORTER_IMAGES = Array.from({length:49}, function(_, i){ return 'images/supporters/' + (i+1) + '.jpg'; });

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- 星空キャンバス ---------------- */
  var canvas = document.getElementById('starfield');
  var ctx = canvas.getContext('2d');
  var dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  var W = 0, H = 0;
  var pointer = {x:0, y:0, active:false};
  var layers = [];
  var shootingStars = [];
  var rafId = null;
  var lastShot = 0;

  function rand(a,b){ return a + Math.random()*(b-a); }

  function sizeCanvas(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function buildLayers(){
    var narrow = W < 640;
    var counts = narrow ? [105,68,40] : [185,125,72];
    layers = [
      {stars:[], speed:0.015, size:[0.5,1.1], alpha:[0.25,0.55], parallax:0.15},
      {stars:[], speed:0.035, size:[0.7,1.5], alpha:[0.4,0.75], parallax:0.35},
      {stars:[], speed:0.07,  size:[1.0,2.1], alpha:[0.55,0.95], parallax:0.65}
    ];
    layers.forEach(function(layer, li){
      var n = counts[li];
      for(var i=0;i<n;i++){
        layer.stars.push({
          x: rand(0,W), y: rand(0,H),
          r: rand(layer.size[0], layer.size[1]),
          a: rand(layer.alpha[0], layer.alpha[1]),
          phase: rand(0, Math.PI*2),
          vx: layer.speed * rand(0.6,1.2) * -1,
          vy: layer.speed * rand(0.15,0.4)
        });
      }
    });
  }

  function maybeSpawnShootingStar(t){
    if(reduceMotion) return;
    if(t - lastShot < rand(5000,11000)) return;
    lastShot = t;
    var startX = rand(W*0.2, W*0.9);
    var startY = rand(0, H*0.35);
    var angle = rand(2.4, 2.9); /* おおむね左下方向 */
    var speed = rand(6, 10);
    shootingStars.push({
      x:startX, y:startY,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0, maxLife: rand(28,44)
    });
  }

  function draw(t){
    ctx.clearRect(0,0,W,H);
    var px = pointer.active ? (pointer.x/W - 0.5) : 0;
    var py = pointer.active ? (pointer.y/H - 0.5) : 0;

    layers.forEach(function(layer){
      if(!reduceMotion){
        layer.stars.forEach(function(s){
          s.x += s.vx; s.y += s.vy;
          if(s.x < -4) s.x = W+4;
          if(s.x > W+4) s.x = -4;
          if(s.y > H+4) s.y = -4;
        });
      }
      var offX = px * 22 * layer.parallax;
      var offY = py * 14 * layer.parallax;
      layer.stars.forEach(function(s){
        var tw = reduceMotion ? s.a : s.a * (0.65 + 0.35*Math.sin(t*0.0016 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x+offX, s.y+offY, s.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(224,238,255,'+tw.toFixed(3)+')';
        ctx.fill();
      });
    });

    if(!reduceMotion){
      maybeSpawnShootingStar(t);
      shootingStars = shootingStars.filter(function(sh){ return sh.life < sh.maxLife; });
      shootingStars.forEach(function(sh){
        sh.life++;
        sh.x += sh.vx; sh.y += sh.vy;
        var progress = sh.life/sh.maxLife;
        var alpha = progress < 0.7 ? 1 : (1 - (progress-0.7)/0.3);
        var tailX = sh.x - sh.vx*5.5, tailY = sh.y - sh.vy*5.5;
        var grad = ctx.createLinearGradient(sh.x, sh.y, tailX, tailY);
        grad.addColorStop(0, 'rgba(255,255,255,'+alpha+')');
        grad.addColorStop(1, 'rgba(107,224,224,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(sh.x, sh.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      });
    }

    if(!reduceMotion){
      rafId = requestAnimationFrame(draw);
    }
  }

  function start(){
    sizeCanvas();
    buildLayers();
    if(rafId) cancelAnimationFrame(rafId);
    if(reduceMotion){
      draw(0); /* 静止フレームを1回だけ描画 */
    } else {
      rafId = requestAnimationFrame(draw);
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(start, 200);
  });

  window.addEventListener('pointermove', function(e){
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
  }, {passive:true});

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      if(rafId) cancelAnimationFrame(rafId);
      rafId = null;
    } else if(!reduceMotion && !rafId){
      rafId = requestAnimationFrame(draw);
    }
  });

  start();

  /* ---------------- 渦巻銀河スプライト（1回だけ生成してCSSで回転） ---------------- */
  var gCanvas = document.getElementById('galaxySprite');
  var gCtx = gCanvas.getContext('2d');
  var gSize = 760;
  var gDpr = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1));
  gCanvas.width = gSize*gDpr;
  gCanvas.height = gSize*gDpr;
  gCtx.setTransform(gDpr,0,0,gDpr,0,0);

  (function drawGalaxy(){
    var cx = gSize/2, cy = gSize/2;
    /* 中心の淡いグロー */
    var core = gCtx.createRadialGradient(cx,cy,0,cx,cy,gSize*0.22);
    core.addColorStop(0,'rgba(235,255,247,0.75)');
    core.addColorStop(0.35,'rgba(52,224,177,0.4)');
    core.addColorStop(1,'rgba(52,224,177,0)');
    gCtx.fillStyle = core;
    gCtx.fillRect(0,0,gSize,gSize);

    var arms = 3;
    var starsPerArm = 480;
    for(var a=0; a<arms; a++){
      var armOffset = (a/arms) * Math.PI*2;
      for(var i=0; i<starsPerArm; i++){
        var tt = i/starsPerArm;
        var theta = tt*Math.PI*4.2 + armOffset;
        var radius = tt*gSize*0.46;
        var jitter = rand(-1,1)*(16+tt*52);
        var x = cx + Math.cos(theta)*radius + jitter;
        var y = cy + Math.sin(theta)*radius + jitter*0.6;
        var r = rand(0.4, 1.6) * (1-tt*0.4);
        var hueMix = Math.random();
        var color = hueMix < 0.55 ? '224,238,255' : (hueMix < 0.82 ? '107,224,224' : '218,185,73');
        var alpha = rand(0.25, 0.88) * (1-tt*0.28);
        gCtx.beginPath();
        gCtx.arc(x,y,Math.max(r,0.3),0,Math.PI*2);
        gCtx.fillStyle = 'rgba('+color+','+alpha.toFixed(3)+')';
        gCtx.fill();
      }
    }
  })();

  /* ---------------- チェッカーアイコン:各チェッカーの画像をランダムに5秒周期で切替 ---------------- */
  (function initIconGallery(){
    var icons = document.querySelectorAll('.navcard .icon[data-pool]');
    if(!icons.length) return;

    function poolFor(el){ return el.getAttribute('data-pool') === 'unit' ? UNIT_IMAGES : SUPPORTER_IMAGES; }

    function setImage(img, src){
      img.classList.remove('show');
      window.setTimeout(function(){
        img.src = src;
        img.onload = function(){ img.classList.add('show'); };
      }, reduceMotion ? 0 : 260);
    }

    var states = [];
    icons.forEach(function(el){
      var pool = poolFor(el);
      var img = el.querySelector('.icoImg');
      if(el.getAttribute('data-pool') === 'supporter'){ img.classList.add('poolSupporter'); }
      var idx = Math.floor(Math.random()*pool.length);
      img.src = pool[idx];
      img.onload = function(){ img.classList.add('show'); };
      states.push({el:el, img:img, pool:pool, idx:idx});
    });

    if(reduceMotion) return; /* 視差効果を減らす設定では最初の1枚で固定 */

    window.setInterval(function(){
      if(document.hidden) return; /* タブが非表示の間は切り替えない */
      states.forEach(function(s){
        var next = Math.floor(Math.random()*s.pool.length);
        if(s.pool.length > 1 && next === s.idx){ next = (next+1) % s.pool.length; }
        s.idx = next;
        setImage(s.img, s.pool[next]);
      });
    }, 5000);
  })();
})();
</script>
<script src="auth.js" defer></script>
</body>
</html>
